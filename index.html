<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RankingRock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">Ranking<span>Rock</span></div>
  <p>El torneo definitivo del rock nacional argentino</p>
</header>

<main>
  <section id="home" class="screen active">
    <div class="hero">
      <h1>¿Quién es el mejor?</h1>
      <p>16 artistas. 4 rondas. Un campeón.</p>
      <button id="startBtn" class="main-btn">EMPEZAR TORNEO</button>
      <button id="statsBtn" class="secondary-btn">VER ESTADÍSTICAS</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <button id="homeBtn" class="small-btn">← Inicio</button>
      <div>
        <strong id="roundName">OCTAVOS</strong>
        <span id="matchNumber"></span>
      </div>
      <button id="resetBtn" class="small-btn">Reiniciar historial</button>
    </div>
    <div class="progress"><div id="progressFill"></div></div>
    <div id="match" class="match"></div>
  </section>

  <section id="stats" class="screen">
    <div class="topbar">
      <button id="statsHomeBtn" class="small-btn">← Inicio</button>
      <strong>HISTORIAL DE RANKINGROCK</strong>
      <span></span>
    </div>
    <div id="statsContent"></div>
  </section>
</main>

<footer>RankingRock · Rock nacional argentino</footer>
<script src="script.js"></script>
</body>
</html>
